name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GLOBAL_RNG_SEED: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run determinism check
        run: pnpm test:determinism

      - name: Run typecheck
        run: pnpm typecheck

      - name: Build app
        run: pnpm build

  openenv-wrapper:
    name: OpenEnv wrapper tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: openenv-core locked
            extra: ""
          - label: openenv-core 0.3.x
            extra: --with "openenv-core[core]~=0.3.0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: Show openenv-core version
        run: uv run --frozen --with pytest ${{ matrix.extra }} python -c "import importlib.metadata as m; print('openenv-core', m.version('openenv-core'))"

      - name: Run wrapper tests
        run: uv run --frozen --with pytest ${{ matrix.extra }} pytest tests
